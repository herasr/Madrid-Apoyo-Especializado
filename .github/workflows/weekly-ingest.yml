name: Ingesta Registral Semanal DATAMAD

on:
  schedule:
    # Ejecución programada todos los lunes a las 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  weekly-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ingesta de datos y verificación SHA-256
        run: npm run ingest

      - name: Ejecutar batería de pruebas y cobertura mínima
        run: npm run test:coverage

      - name: Verificar tipos TypeScript y compilación de producción
        run: |
          npm run lint
          npm run build

      - name: Commit y push de capturas e informe de cambios
        # Política de retención unificada: solo se versionan los ficheros -latest.csv,
        # snapshot-metadata.json, snapshot-diffs.json y catalog-classified.json;
        # la evolución semanal queda trazada en el historial de commits de Git.
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/snapshots/
          if git diff --staged --quiet; then
            echo "Sin cambios en el registro respecto al snapshot anterior."
          else
            git commit -m "chore(data): actualización semanal automatizada de capturas e ingesta de datos"
            git pull --rebase origin "${{ github.ref_name }}"
            git push
          fi

      - name: Abrir alerta automática si falla la ingesta semanal
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = 'Alerta automática: fallo en la ingesta registral semanal';
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 30
            });
            const existing = openIssues.find((i) => i.title === title);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `La ejecución programada de **Ingesta Registral Semanal DATAMAD** ha fallado en el commit \`${context.sha}\`.\n\n- Enlace al registro de ejecución: ${runUrl}\n- Posibles causas: indisponibilidad temporal de \`datos.madrid.es\` / \`datos.comunidad.madrid\`, cambio de cabeceras CSV o discrepancia de integridad SHA-256.\n\n*Aviso generado automáticamente por GitHub Actions.*`;
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bug']
              });
            }
