name: Ingesta Registral Semanal DATAMAD

on:
  schedule:
    # Ejecución programada todos los lunes a las 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly-ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ingesta de datos y verificación SHA-256
        run: npm run ingest

      - name: Ejecutar tests unitarios de motor de búsqueda
        run: npm run test

      - name: Commit y push de capturas e informe de cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/snapshots/
          if git diff --staged --quiet; then
            echo "Sin cambios en el registro respecto al snapshot anterior."
          else
            git commit -m "chore(data): actualización semanal automatizada de capturas e ingesta de datos"
            git push
          fi
