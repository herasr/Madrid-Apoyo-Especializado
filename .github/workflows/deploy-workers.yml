name: Despliegue en Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Ingesta Registral Semanal DATAMAD']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workers-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias con cobertura y comprobación de tipos
        run: |
          npm run test:coverage
          npm run lint

      - name: Compilar sitio estático para Cloudflare Workers
        run: npm run build

      - name: Instalar navegador Chromium y dependencias del sistema para E2E
        run: npx playwright install --with-deps chromium

      - name: Ejecutar smoke tests E2E y WCAG sobre compilación de producción
        env:
          PLAYWRIGHT_BASE_URL: 'http://127.0.0.1:4173/'
        run: npm run test:e2e

      - name: Subir traza de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7

      - name: Desplegar en Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  post-deploy-smoke:
    runs-on: ubuntu-latest
    needs: build-and-deploy
    timeout-minutes: 10
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium para verificación sobre la URL pública
        run: npx playwright install --with-deps chromium

      - name: Smoke test E2E y WCAG contra Cloudflare Workers desplegado
        env:
          CI: 'true'
          PLAYWRIGHT_EXTERNAL_URL: 'https://madrid-apoyo-especializado.herasr.workers.dev/'
        run: npm run test:e2e

      - name: Subir traza post-deploy si falla
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-post-deploy-trace
          path: test-results/
          retention-days: 7
