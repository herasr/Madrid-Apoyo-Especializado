name: Despliegue en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias con cobertura y comprobación de tipos
        run: |
          npm run test:coverage
          npm run lint

      - name: Compilar sitio estático para GitHub Pages
        env:
          VITE_BASE_PATH: '/${{ github.event.repository.name }}/'
        run: npm run build

      - name: Instalar navegador Chromium y dependencias del sistema para E2E
        run: npx playwright install --with-deps chromium

      - name: Ejecutar smoke tests E2E y WCAG sobre compilación de producción
        env:
          VITE_BASE_PATH: '/${{ github.event.repository.name }}/'
          PLAYWRIGHT_BASE_URL: 'http://127.0.0.1:4173/${{ github.event.repository.name }}/'
        run: npm run test:e2e

      - name: Subir traza de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7

      - name: Configurar GitHub Pages (activación declarativa si falta)
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Subir artefacto dist
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  post-deploy-smoke:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium para verificación sobre la URL pública
        run: npx playwright install --with-deps chromium

      - name: Smoke test E2E y WCAG contra GitHub Pages desplegado
        env:
          CI: 'true'
          PLAYWRIGHT_EXTERNAL_URL: '${{ needs.deploy.outputs.page_url || format(''https://{0}.github.io/{1}/'', github.repository_owner, github.event.repository.name) }}'
        run: npm run test:e2e

      - name: Subir traza post-deploy si falla
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-post-deploy-trace
          path: test-results/
          retention-days: 7
